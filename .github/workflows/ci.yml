name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      # One platform failing must not hide another platform's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # peerDependencies are marked optional so npm does not install them — but the tests and the type check both need them.
      #
      # This step used to be last (bundled with tsc), so npm test ran first and every file that
      # imports pi failed with ERR_MODULE_NOT_FOUND in CI. Locally node_modules existed so
      # everything was green, and the red CI went unnoticed. Installing first gives both steps
      # something to work with.
      - name: Install peer deps
        run: npm install --no-save typescript @types/node @earendil-works/pi-coding-agent @earendil-works/pi-tui
      - name: Unit tests
        run: npm test
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Type check
        run: npx tsc --noEmit
